<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>共搭成片 · 服务商后台</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf2ef;color:#14231f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:850px;margin:auto;min-height:100vh;background:#fff;padding:22px}.hide{display:none!important}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:20px;font-weight:850}.link{border:0;background:none;color:#116552;padding:8px}h1{font-size:30px;margin:28px 0 8px}h2{font-size:21px;margin:28px 0 10px}.muted{color:#70807b;font-size:13px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card,.store,.panel{border:1px solid #dfe8e5;border-radius:15px;padding:15px;background:#fafcfb}.card b{display:block;font-size:25px;color:#116552;margin-top:8px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.field{width:100%;height:48px;border:1px solid #ccd9d5;background:#fff;border-radius:12px;padding:11px;font:inherit;margin-top:8px}.btn{border:0;border-radius:11px;background:#116552;color:#fff;padding:12px 15px;font-weight:750;margin-top:10px}.btn.light{background:#eaf4f1;color:#205c4e}.btn.warn{background:#fff0ed;color:#a13b2f}.stores{display:grid;gap:12px}.store-head{display:flex;justify-content:space-between;gap:10px}.balance{font-size:24px;color:#116552;font-weight:850}.actions{display:flex;flex-wrap:wrap;gap:7px}.actions .btn{margin-top:10px}.tag{font-size:12px;background:#eaf4f1;color:#116552;padding:4px 7px;border-radius:20px}.tag.off{background:#f6e9e7;color:#9c4035}.ledger{font-size:13px;border-top:1px solid #e5ebe9;margin-top:12px}.row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #edf1ef}.positive{color:#147354}.negative{color:#ad4238}.login{max-width:420px;margin:15vh auto}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#172b26;color:#fff;padding:13px 18px;border-radius:12px}@media(max-width:650px){.cards{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.app{padding:18px}}\n+</style></head><body><main class="app"><section id="login" class="login hide"><h1>服务商后台</h1><p class="muted">请使用超级管理员账号登录</p><input id="loginUser" class="field" value="admin" placeholder="管理员账号"><input id="loginPass" class="field" type="password" placeholder="密码"><button class="btn" style="width:100%" onclick="login()">登录</button></section><section id="dashboard" class="hide"><div class="top"><div class="brand">✦ 共搭成片 · 服务商后台</div><div><button class="link" onclick="location.href='/'">门店工作台</button><button class="link" onclick="logout()">退出</button></div></div><h1>经营总览</h1><div id="overview" class="cards"></div><h2>新建门店账号</h2><div class="panel grid"><input id="newName" class="field" placeholder="门店名称"><input id="newUser" class="field" placeholder="登录账号"><input id="newPass" class="field" type="password" placeholder="初始密码（至少6位）"><input id="newLimit" class="field" type="number" placeholder="每月使用上限，0为不限"><button class="btn" onclick="createStore()">创建门店</button></div><h2>收费标准</h2><div class="panel grid"><label>每条成片售价<input id="videoPrice" class="field" type="number" step=".01"></label><label>图片重生成售价<input id="imagePrice" class="field" type="number" step=".01"></label><label>人物片头/片尾售价<input id="avatarPrice" class="field" type="number" step=".01"></label><label>平台月总预算<input id="globalLimit" class="field" type="number" step=".01"></label><button class="btn" onclick="savePricing()">保存价格</button></div><h2>门店与余额</h2><div id="stores" class="stores"></div></section><div id="toast" class="toast hide"></div></main><script>
const API='https://api.opc.city';let token=localStorage.getItem('autocut_token')||sessionStorage.getItem('autocut_token')||'';const $=id=>document.getElementById(id);function toast(t){$('toast').textContent=t;$('toast').classList.remove('hide');setTimeout(()=>$('toast').classList.add('hide'),2600)}async function api(path,opt={}){opt.headers=Object.assign({},opt.headers||{},{Authorization:'Bearer '+token});let r=await fetch(API+path,opt),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||'操作失败');return d}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function login(){try{let r=await fetch(API+'/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('loginUser').value,password:$('loginPass').value,remember:true})}),d=await r.json();if(!r.ok)throw Error(d.detail);if(d.role!=='admin')throw Error('此账号不是管理员');token=d.token;localStorage.setItem('autocut_token',token);open()}catch(e){toast(e.message)}}async function logout(){try{await api('/logout',{method:'POST'})}catch(e){}localStorage.removeItem('autocut_token');location.reload()}
async function open(){$('login').classList.add('hide');$('dashboard').classList.remove('hide');await Promise.all([loadOverview(),loadStores(),loadPricing()])}async function loadOverview(){let d=await api('/admin/overview');$('overview').innerHTML=[['门店数量',d.stores],['本月成片',d.month_videos],['本月收入','¥'+d.month_revenue.toFixed(2)],['预估利润','¥'+d.estimated_profit.toFixed(2)]].map(x=>'<div class="card"><span class="muted">'+x[0]+'</span><b>'+x[1]+'</b></div>').join('')}
async function loadPricing(){let p=await api('/admin/pricing');$('videoPrice').value=p.video_price;$('imagePrice').value=p.image_retry_price;$('avatarPrice').value=p.avatar_clip_price;$('globalLimit').value=p.global_monthly_limit}async function savePricing(){try{await api('/admin/pricing',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({video_price:+$('videoPrice').value,image_retry_price:+$('imagePrice').value,avatar_clip_price:+$('avatarPrice').value,global_monthly_limit:+$('globalLimit').value})});toast('价格已保存')}catch(e){toast(e.message)}}
async function createStore(){try{await api('/admin/stores',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('newName').value,username:$('newUser').value,password:$('newPass').value,monthly_limit:+$('newLimit').value||0})});['newName','newUser','newPass','newLimit'].forEach(x=>$(x).value='');toast('门店账号已创建');loadStores();loadOverview()}catch(e){toast(e.message)}}
async function loadStores(){let rows=await api('/admin/stores');$('stores').innerHTML=rows.map(s=>'<div class="store"><div class="store-head"><div><b>'+esc(s.name)+'</b><div class="muted">账号：'+esc(s.username||'—')+'　月消费：¥'+Number(s.month_spend||0).toFixed(2)+'</div></div><div><span class="tag '+(s.status==='active'?'':'off')+'">'+(s.status==='active'?'使用中':'已停用')+'</span><div class="balance">¥'+Number(s.balance).toFixed(2)+'</div></div></div><div class="actions"><button class="btn" onclick="recharge(\''+s.id+'\')">充值/调整</button><button class="btn light" onclick="limit(\''+s.id+'\','+Number(s.monthly_limit||0)+')">月额度</button><button class="btn light" onclick="password(\''+s.id+'\')">重置密码</button><button class="btn '+(s.status==='active'?'warn':'light')+'" onclick="statusStore(\''+s.id+'\',\''+(s.status==='active'?'disabled':'active')+'\')">'+(s.status==='active'?'停用':'启用')+'</button><button class="btn light" onclick="ledger(\''+s.id+'\',this)">流水</button></div><div id="ledger-'+s.id+'" class="ledger hide"></div></div>').join('')}
async function recharge(id){let a=prompt('输入充值金额；负数表示扣减余额','100');if(a===null)return;let note=prompt('备注','线下收款充值')||'';try{await api('/admin/stores/'+id+'/recharge',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({amount:+a,note})});toast('余额已更新');loadStores();loadOverview()}catch(e){toast(e.message)}}async function limit(id,current){let n=prompt('每月最高可消费金额，0表示不限',current);if(n===null)return;try{await api('/admin/stores/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({monthly_limit:+n})});loadStores()}catch(e){toast(e.message)}}async function password(id){let p=prompt('输入新密码（至少6位）');if(!p)return;try{await api('/admin/stores/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:p})});toast('密码已重置')}catch(e){toast(e.message)}}async function statusStore(id,status){try{await api('/admin/stores/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});loadStores()}catch(e){toast(e.message)}}async function ledger(id,button){let box=$('ledger-'+id);if(!box.classList.contains('hide'))return box.classList.add('hide');try{let rows=await api('/admin/stores/'+id+'/ledger');box.innerHTML=rows.length?rows.slice(0,30).map(x=>'<div class="row"><span>'+new Date(x.created_at*1000).toLocaleDateString()+' '+esc(x.note||x.item)+'</span><b class="'+(x.amount>=0?'positive':'negative')+'">'+(x.amount>=0?'+':'')+Number(x.amount).toFixed(2)+'</b></div>').join(''):'<p class="muted">暂无流水</p>';box.classList.remove('hide')}catch(e){toast(e.message)}}
async function boot(){if(token)try{let s=await api('/session');if(s.role==='admin')return open()}catch(e){}$('login').classList.remove('hide')}boot();
</script></body></html>
