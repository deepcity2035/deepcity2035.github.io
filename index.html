<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>共搭成片 · 门店版</title><style>
*{box-sizing:border-box}body{margin:0;background:#eaf0ed;color:#14231f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:560px;min-height:100vh;margin:auto;background:#fff;padding:20px 18px 90px}.hide{display:none!important}.brand{display:flex;align-items:center;justify-content:space-between;font-weight:850}.brand-left{display:flex;align-items:center;gap:8px}.logo{display:grid;place-items:center;width:39px;height:39px;border-radius:13px;background:#116552;color:#fff}.link{border:0;background:none;color:#526660;padding:7px;font-size:13px}h1{font-size:29px;line-height:1.2;margin:28px 0 9px}h2{font-size:21px;margin:25px 0 9px}.muted{color:#687873;font-size:13px;line-height:1.65}.field,.area{width:100%;border:1px solid #cbd9d5;border-radius:14px;background:#f8fbfa;padding:13px;font:inherit;font-size:16px;outline:none}.field{height:49px}select.field{appearance:auto;color:#20352f}.field{margin-top:10px}.area{min-height:92px;resize:vertical;margin-top:10px}.area.script{min-height:270px;line-height:1.75}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.btn{width:100%;border:0;border-radius:14px;background:#116552;color:#fff;padding:15px;font-size:16px;font-weight:800;margin-top:15px}.btn.light{background:#eef4f2;color:#31564d}.btn:disabled{opacity:.5}.login{padding-top:18vh}.remember{display:flex;gap:9px;margin:14px 2px;color:#53645f;font-size:14px}.templates{display:grid;grid-template-columns:1fr 1fr;gap:9px}.template{border:1px solid #dce6e2;border-radius:13px;background:#f8fbfa;padding:13px 8px;text-align:left}.template b{display:block}.template small{color:#75837f}.template.on{border:2px solid #116552;background:#eaf6f2}.choices{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.choices button,.styles button{border:1px solid #dfe8e5;background:#fff;border-radius:10px;padding:10px 2px}.choices .on,.styles .on{background:#116552;color:#fff}.styles{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.notice{padding:13px;margin-top:13px;border-radius:12px;background:#eef8f4;color:#38655a;font-size:13px}.history{margin-top:28px;border-top:1px solid #edf0ef}.project{display:flex;justify-content:space-between;align-items:center;padding:15px 2px;border-bottom:1px solid #edf0ef}.project b{max-width:330px}.tag{font-size:12px;color:#116552;background:#e9f5f1;padding:5px 8px;border-radius:20px}.step{display:flex;gap:5px;margin:20px 0}.step i{height:5px;flex:1;background:#e2e9e6}.step i.on{background:#1d8068}.scene,.asset{border:1px solid #e1e8e5;border-radius:16px;margin-top:14px;overflow:hidden}.scene img,.scene video,.asset img,.asset video{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#0a0f0e}.scene-body,.asset-body{padding:12px}.scene-title{display:flex;justify-content:space-between;font-weight:800}.scene .area{min-height:70px;font-size:14px}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.actions button{border:0;border-radius:9px;padding:10px 3px;background:#eef4f2;color:#31564d}.upload{display:block;text-align:center;border:1px dashed #74aa9d;border-radius:13px;padding:15px;color:#116552;margin-top:12px}.upload input{display:none}.panel{padding:15px;border-radius:15px;background:#f6f9f8;margin-top:14px}.asset-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.asset{margin-top:0}.asset-body{font-size:13px}.clip video,.video{width:100%;aspect-ratio:16/9;background:#000;border-radius:12px}.range{width:100%;accent-color:#116552}.cost{margin-top:16px;padding:16px;border-radius:15px;background:#eef8f4}.cost strong{font-size:29px;color:#116552}.status{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);width:min(520px,calc(100% - 36px));padding:13px;background:#172b26ef;color:#fff;border-radius:13px}.error{color:#bd2424;font-size:13px}
</style></head><body><main class="app">
<section id="login" class="login"><div class="logo">✦</div><h1>登录共搭成片</h1><p class="muted">泛家居门店短视频工作台</p><input id="user" class="field" placeholder="账号"><input id="pass" class="field" type="password" placeholder="密码"><label class="remember"><input id="remember" type="checkbox" checked>30天内保持登录</label><p id="err" class="error"></p><button class="btn" onclick="login()">登录</button></section>
<section id="studio" class="hide"><div class="brand"><div class="brand-left"><span class="logo">✦</span><span>共搭成片<small id="balance" style="display:block;color:#687873;font-weight:500"></small></span></div><div><button class="link" onclick="showAssets()">素材库</button><button class="link" onclick="showProfile()">门店资料</button><button class="link" onclick="logout()">退出</button></div></div>
<div id="home"><h1>选几个选项，<br>AI帮门店完成内容。</h1><p class="muted">大部分信息直接下拉选择，只在需要时补充一句。</p><h2>这次想做什么</h2><div id="templates" class="templates"></div><h2>本次内容</h2><input id="city" class="field" list="cities" placeholder="选择或输入城市"><datalist id="cities"><option value="北京"><option value="上海"><option value="广州"><option value="深圳"><option value="杭州"><option value="成都"><option value="重庆"><option value="苏州"><option value="南京"><option value="武汉"><option value="西安"><option value="长沙"><option value="郑州"><option value="佛山"><option value="东莞"></datalist><select id="category" class="field" onchange="updateProducts()"><option value="">选择经营品类</option><option>全屋定制</option><option>家具软装</option><option>门窗</option><option>瓷砖岩板</option><option>卫浴</option><option>照明灯饰</option><option>地板</option><option>涂料墙布</option><option>厨房电器</option><option>智能家居</option><option>装修设计</option></select><select id="product" class="field"><option value="">先选择经营品类</option></select><input id="productDetail" class="field" placeholder="可选：具体系列、风格或案例名称"><select id="selling" class="field"><option value="设计效果与空间利用">主打：设计效果与空间利用</option><option value="环保材质与健康品质">主打：环保材质与健康品质</option><option value="工艺细节与耐用性">主打：工艺细节与耐用性</option><option value="一站式省心服务">主打：一站式省心服务</option><option value="交付速度与工期保障">主打：交付速度与工期保障</option><option value="高性价比与透明报价">主打：高性价比与透明报价</option><option value="售后服务与本地保障">主打：售后服务与本地保障</option></select><input id="sellingDetail" class="field" placeholder="可选：补充一个门店独有卖点"><select id="offerType" class="field"><option value="">本次不讲活动</option><option value="到店专享礼遇">到店专享礼遇</option><option value="限时折扣活动">限时折扣活动</option><option value="免费量房或设计">免费量房/设计</option><option value="样板间或套餐活动">样板间/套餐活动</option><option value="老客户转介绍活动">老客户转介绍活动</option></select><input id="offerDetail" class="field" placeholder="可选：填写真实优惠或价格"><select id="audience" class="field"><option>准备装修的新房业主</option><option>改善居住品质的家庭</option><option>旧房翻新客户</option><option>婚房装修客户</option><option>有孩子的家庭</option><option>注重品质的中高端客户</option><option>商铺或办公空间客户</option></select><h2>时长与画面</h2><div id="durations" class="choices"><button>30秒</button><button class="on">60秒</button><button>90秒</button><button>3分钟</button></div><div id="styles" class="styles"></div><button class="btn" onclick="createProject()">生成门店文案</button><div class="history"><h2>历史项目</h2><div id="history"><p class="muted">正在读取…</p></div></div></div>
<div id="profile" class="hide"><button class="link" onclick="showHome()">← 返回</button><h1>门店资料</h1><p class="muted">填写一次，之后自动用于文案和片尾。</p><input id="storeName" class="field" placeholder="门店名称"><div class="grid2"><input id="storeCity" class="field" placeholder="城市"><input id="storeCategories" class="field" placeholder="主营品类"></div><input id="storeAddress" class="field" placeholder="门店地址"><input id="storePhone" class="field" placeholder="联系电话"><input id="storeSlogan" class="field" placeholder="品牌口号"><div class="grid2"><label class="upload">上传Logo<input id="logoFile" type="file" accept="image/*"></label><label class="upload">上传二维码<input id="qrFile" type="file" accept="image/*"></label></div><p id="profileMedia" class="muted"></p><button class="btn" onclick="saveProfile()">保存门店资料</button></div>
<div id="library" class="hide"><button class="link" onclick="showHome()">← 返回</button><h1>商品与案例素材库</h1><p class="muted">保存产品图、完工案例、展厅和安装视频。</p><label class="upload">＋ 上传图片或视频<input id="assetFile" type="file" accept="image/*,video/mp4,video/quicktime"></label><div id="assets" class="asset-grid" style="margin-top:16px"></div></div>
<div id="editor" class="hide"><button class="link" onclick="showHome()">← 返回项目</button><div class="step"><i id="s1"></i><i id="s2"></i><i id="s3"></i></div><div id="waiting"><h1 id="waitTitle">正在处理</h1><p id="waitText" class="muted"></p></div>
<div id="scriptReview" class="hide"><h1>确认文案和事实</h1><p class="muted">重点检查价格、优惠、材质、工期和售后。</p><div id="facts" class="notice"></div><input id="editTitle" class="field"><input id="editHook" class="field"><textarea id="editScript" class="area script"></textarea><textarea id="editDesc" class="area"></textarea><button class="btn" onclick="confirmScript()">事实无误，生成配图</button></div>
<div id="imageReview" class="hide"><h1>确认镜头</h1><p class="muted">可调用门店素材，也可上传图片或插入1～30秒视频。</p><div id="scenes"></div><button class="btn light" onclick="toggleProjectAssets()">从门店素材库插入</button><div id="projectAssets" class="asset-grid hide" style="margin-top:12px"></div><label class="upload">＋ 插入图片<input id="insertImage" type="file" accept="image/*"></label><label class="upload">＋ 插入视频片段<input id="insertVideo" type="file" accept="video/mp4,video/quicktime,.mp4,.mov"></label><div id="clipPicker" class="panel clip hide"><video id="clipPreview" controls muted playsinline></video><p id="sourceDuration" class="muted"></p><div class="grid2"><input id="clipStartNumber" class="field" type="number" step=".1"><input id="clipEndNumber" class="field" type="number" step=".1"></div><input id="clipStart" class="range" type="range" step=".1"><input id="clipEnd" class="range" type="range" step=".1"><p id="clipLength" class="notice"></p><button id="uploadClip" class="btn" onclick="confirmVideoClip()">插入这个片段</button><button class="btn light" onclick="closeClipPicker()">取消</button></div><button class="btn" onclick="produce()">镜头确认，正式生产</button></div>
<div id="done" class="hide"><h1>成片已完成</h1><video id="preview" class="video" controls playsinline></video><div id="cost" class="cost"></div><button class="btn" onclick="downloadVideo()">下载成片</button></div></div></section><div id="toast" class="status hide"></div></main>
<script>
const API='https://api.opc.city',T=[['store_traffic','门店引流','吸引本地客户到店'],['product','产品种草','讲清产品价值'],['case','案例展示','用完工案例获客'],['promotion','活动促销','发布真实优惠'],['tips','装修避坑','建立专业信任'],['testimonial','客户见证','强化口碑证据'],['designer','设计师IP','打造专业人设'],['local','同城获客','强化城市标签']],S=[['enterprise','品质科技'],['business','真实商业'],['city','城市空间'],['oriental','东方美学'],['illustration','简约插画'],['future','未来设计']],PRODUCTS={'全屋定制':['整家定制','衣柜收纳','橱柜厨房','客餐厅空间','儿童房','旧房定制改造'],'家具软装':['沙发','床和床垫','餐桌椅','客厅整套','软装搭配','样板间案例'],'门窗':['系统门窗','封阳台','阳光房','入户门','室内木门'],'瓷砖岩板':['客厅瓷砖','厨卫瓷砖','岩板背景墙','大板铺贴','全屋通铺'],'卫浴':['智能马桶','浴室柜','淋浴房','花洒五金','整套卫浴'],'照明灯饰':['无主灯设计','全屋灯光','客厅灯','餐厅灯','智能照明'],'地板':['实木地板','复合地板','全屋地板','地暖适配地板'],'涂料墙布':['艺术涂料','乳胶漆','墙布墙纸','儿童房墙面'],'厨房电器':['烟灶套装','集成灶','洗碗机','蒸烤一体机','全套厨电'],'智能家居':['全屋智能','智能门锁','智能影音','智能安防','智能窗帘'],'装修设计':['整屋设计','旧房翻新','局部改造','样板间案例','施工工艺']};let token=localStorage.getItem('autocut_token')||sessionStorage.getItem('autocut_token')||'',seconds=60,imageStyle='business',template='store_traffic',current=null,timer=null,clipFile=null,clipUrl='',profileData={},assetRows=[],sessionData={};const $=id=>document.getElementById(id),labels={queued:'等待生成',drafting:'文案生成中',script_review:'待确认文案',images_queued:'等待配图',images_generating:'配图生成中',images_review:'待确认镜头',produce_queued:'等待生产',producing:'视频生产中',done:'已完成',failed:'处理失败'};
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function toast(t){$('toast').textContent=t;$('toast').classList.remove('hide');setTimeout(()=>$('toast').classList.add('hide'),2600)}async function api(path,opt={}){opt.headers=Object.assign({},opt.headers||{},{Authorization:'Bearer '+token});let r=await fetch(API+path,opt),d=await r.json().catch(()=>({}));if(r.status===401){clearLogin();throw Error('登录已失效')}if(!r.ok)throw Error(d.detail||'操作失败');return d}function clearLogin(){localStorage.removeItem('autocut_token');sessionStorage.removeItem('autocut_token');token='';$('studio').classList.add('hide');$('login').classList.remove('hide')}async function login(){try{let remember=$('remember').checked,r=await fetch(API+'/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('user').value,password:$('pass').value,remember})}),d=await r.json();if(!r.ok)throw Error(d.detail);token=d.token;(remember?localStorage:sessionStorage).setItem('autocut_token',token);sessionData=d;openStudio()}catch(e){$('err').textContent=e.message}}async function logout(){try{await api('/logout',{method:'POST'})}catch(e){}clearLogin()}
function only(id){['home','profile','library','editor'].forEach(x=>$(x).classList.toggle('hide',x!==id))}function openStudio(){document.getElementById("login").classList.add("hide");document.getElementById("studio").classList.remove("hide");document.getElementById("balance").textContent=sessionData.role==="admin"?"服务商账号":"余额 ¥"+Number(sessionData.balance||0).toFixed(2);showHome()}function showHome(){if(timer)clearInterval(timer);current=null;only('home');loadProfile(true);loadHistory()}function showProfile(){only('profile');loadProfile(false)}function showAssets(){only('library');loadAssets(true)}function init(){$('templates').innerHTML=T.map((x,i)=>'<button class="template '+(i?'':'on')+'" data-v="'+x[0]+'"><b>'+x[1]+'</b><small>'+x[2]+'</small></button>').join('');$('styles').innerHTML=S.map(x=>'<button class="'+(x[0]==='business'?'on':'')+'" data-v="'+x[0]+'">'+x[1]+'</button>').join('');document.querySelectorAll('.template').forEach(b=>b.onclick=()=>{template=b.dataset.v;document.querySelectorAll('.template').forEach(x=>x.classList.remove('on'));b.classList.add('on')});document.querySelectorAll('#styles button').forEach(b=>b.onclick=()=>{imageStyle=b.dataset.v;document.querySelectorAll('#styles button').forEach(x=>x.classList.remove('on'));b.classList.add('on')});[...$('durations').children].forEach((b,i)=>b.onclick=()=>{seconds=[30,60,90,180][i];[...b.parentNode.children].forEach(x=>x.classList.remove('on'));b.classList.add('on')})}
function updateProducts(){let rows=PRODUCTS[$("category").value]||[];$("product").innerHTML="<option value=\"\">选择产品或案例<\/option>"+rows.map(x=>"<option>"+x+"<\/option>").join("")}async function loadProfile(fill){try{profileData=await api('/store-profile');let m={storeName:'store_name',storeCity:'city',storeCategories:'categories',storeAddress:'address',storePhone:'phone',storeSlogan:'slogan'};Object.keys(m).forEach(id=>$(id).value=profileData[m[id]]||'');$('profileMedia').textContent=(profileData.logo_asset_id?'Logo已设置　':'')+(profileData.qr_asset_id?'二维码已设置':'');if(fill){if(!$('city').value)$('city').value=profileData.city||'';if(!$('category').value)$('category').value=profileData.categories||''}}catch(e){toast(e.message)}}async function saveProfile(){let d={store_name:$('storeName').value,city:$('storeCity').value,categories:$('storeCategories').value,address:$('storeAddress').value,phone:$('storePhone').value,slogan:$('storeSlogan').value,logo_asset_id:profileData.logo_asset_id||'',qr_asset_id:profileData.qr_asset_id||''};try{profileData=await api('/store-profile',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});toast('门店资料已保存');showHome()}catch(e){toast(e.message)}}async function uploadBrand(file,kind){if(!file)return;let f=new FormData();f.append('file',file);f.append('kind',kind);f.append('name',kind==='logo'?'门店Logo':'门店二维码');try{let a=await api('/assets',{method:'POST',body:f});profileData[kind+'_asset_id']=a.id;await api('/store-profile',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(profileData)});$('profileMedia').textContent='门店图片设置已更新';toast('上传成功')}catch(e){toast(e.message)}}$('logoFile').onchange=e=>uploadBrand(e.target.files[0],'logo');$('qrFile').onchange=e=>uploadBrand(e.target.files[0],'qr');
async function loadHistory(){try{let rows=await api('/projects');$('history').innerHTML=rows.length?rows.map(p=>'<div class="project" onclick="openProject(\''+p.id+'\')"><b>'+esc(p.title)+'</b><span class="tag">'+(labels[p.status]||p.status)+'</span></div>').join(''):'<p class="muted">还没有项目</p>'}catch(e){toast(e.message)}}async function createProject(){let d={title:'',seconds,image_style:imageStyle,template,city:$('city').value,category:$('category').value,product:[$('product').value,$('productDetail').value].filter(Boolean).join(' · '),selling_points:[$('selling').value,$('sellingDetail').value].filter(Boolean).join('；'),offer:[$('offerType').value,$('offerDetail').value].filter(Boolean).join('：'),audience:$('audience').value};if(!d.category)return toast('请选择经营品类');if(!d.product)return toast('请选择产品或案例');try{let p=await api('/projects',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});openProject(p.id)}catch(e){toast(e.message)}}
async function loadAssets(libraryOnly){try{assetRows=await api('/assets');let h=assetRows.length?assetRows.map(a=>'<div class="asset">'+(a.media_type==='image'?'<img src="'+API+'/assets/'+a.id+'/file?token='+encodeURIComponent(token)+'">':'<video src="'+API+'/assets/'+a.id+'/file?token='+encodeURIComponent(token)+'" controls muted></video>')+'<div class="asset-body"><b>'+esc(a.name)+'</b>'+(libraryOnly?'':'<button class="link" onclick="insertAsset(\''+a.id+'\')">插入</button>')+'<button class="link" onclick="deleteAsset(\''+a.id+'\')">删除</button></div></div>').join(''):'<p class="muted">还没有素材</p>';$(libraryOnly?'assets':'projectAssets').innerHTML=h}catch(e){toast(e.message)}}$('assetFile').onchange=async e=>{let file=e.target.files[0];if(!file)return;let name=prompt('给素材起个名称',file.name)||file.name,f=new FormData();f.append('file',file);f.append('name',name);try{await api('/assets',{method:'POST',body:f});e.target.value='';loadAssets(true);toast('素材已保存')}catch(x){toast(x.message)}};async function deleteAsset(id){if(!confirm('确定删除这个素材？'))return;try{await api('/assets/'+id,{method:'DELETE'});loadAssets(!$('library').classList.contains('hide'))}catch(e){toast(e.message)}}function toggleProjectAssets(){$('projectAssets').classList.toggle('hide');if(!$('projectAssets').classList.contains('hide'))loadAssets(false)}async function insertAsset(id){try{await api('/projects/'+current.id+'/library-scenes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({asset_id:id,position:-1})});refresh(current.id);toast('素材已插入')}catch(e){toast(e.message)}}
async function openProject(id){only('editor');await refresh(id);if(timer)clearInterval(timer);timer=setInterval(()=>refresh(id),3000)}function step(n){['s1','s2','s3'].forEach((x,i)=>$(x).classList.toggle('on',i<n))}async function refresh(id){try{let p=await api('/projects/'+id);current=p;render(p);if(['script_review','images_review','done','failed'].includes(p.status)&&timer){clearInterval(timer);timer=null}}catch(e){toast(e.message)}}function panels(name){['waiting','scriptReview','imageReview','done'].forEach(x=>$(x).classList.toggle('hide',x!==name))}function render(p){if(['queued','drafting'].includes(p.status)){step(1);panels('waiting');$('waitTitle').textContent='AI正在生成门店文案';$('waitText').textContent='会严格使用填写的真实信息。'}else if(p.status==='script_review'){step(1);panels('scriptReview');$('editTitle').value=p.content.title||p.title;$('editHook').value=p.content.hook||'';$('editScript').value=p.content.script||'';$('editDesc').value=p.content.description||'';let f=p.content.facts||[];$('facts').innerHTML='<b>事实核对</b><br>'+(f.length?f.map(esc).join('<br>'):'本条未使用价格、优惠、工期等敏感事实')}else if(['images_queued','images_generating'].includes(p.status)){step(2);panels('waiting');$('waitTitle').textContent='正在生成配图';$('waitText').textContent='已生成 '+(p.scenes||[]).length+' 个镜头'}else if(p.status==='images_review'){step(2);panels('imageReview');renderScenes(p)}else if(['produce_queued','producing'].includes(p.status)){step(3);panels('waiting');$('waitTitle').textContent='正在正式生产';$('waitText').textContent='正在生成配音、字幕、画面和门店片尾。'}else if(p.status==='done'){step(3);panels('done');$('preview').src=API+'/projects/'+p.id+'/download?token='+encodeURIComponent(token);let b=p.billing||{},amount=b.charge??p.billed_price??0;$('cost').innerHTML='<div class="muted">本条计费金额</div><strong>¥'+Number(amount).toFixed(2)+'</strong><p class="muted">按本次阿里云预估成本和门店收费倍率结算</p>'}else if(p.status==='failed'){panels('waiting');$('waitTitle').textContent='处理未完成';$('waitText').textContent=p.error||'请稍后重试'}}
async function confirmScript(){try{await api('/projects/'+current.id+'/script',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:$('editTitle').value,hook:$('editHook').value,script:$('editScript').value,description:$('editDesc').value})});openProject(current.id)}catch(e){toast(e.message)}}function acts(id){return '<div class="actions"><button onclick="removeScene(\''+id+'\')">删除</button><button onclick="move(\''+id+'\',-1)">上移</button><button onclick="move(\''+id+'\',1)">下移</button></div>'}function renderScenes(p){$('scenes').innerHTML=p.scenes.map((s,i)=>s.type==='video'?'<div class="scene"><video src="'+API+'/projects/'+p.id+'/media/'+s.media+'?token='+encodeURIComponent(token)+'" controls muted></video><div class="scene-body"><b>镜头 '+(i+1)+' · 视频 '+Number(s.duration||0).toFixed(1)+'秒</b>'+acts(s.id)+'</div></div>':'<div class="scene"><img src="'+API+'/projects/'+p.id+'/images/'+s.image+'?token='+encodeURIComponent(token)+'&v='+(s.version||0)+'"><div class="scene-body"><div class="scene-title"><span>镜头 '+(i+1)+(s.outro?' · 门店片尾':' · 图片')+'</span></div><textarea id="prompt-'+s.id+'" class="area">'+esc(s.prompt)+'</textarea><div class="actions">'+(s.outro?'':'<button onclick="regen(\''+s.id+'\')">重新生成</button><button onclick="replacePick(\''+s.id+'\')">上传替换</button>')+'<button onclick="removeScene(\''+s.id+'\')">删除</button><button onclick="move(\''+s.id+'\',-1)">上移</button><button onclick="move(\''+s.id+'\',1)">下移</button></div><input class="hide" id="file-'+s.id+'" type="file" accept="image/*" onchange="replaceScene(\''+s.id+'\',this.files[0])"></div></div>').join('')}
async function regen(id){try{await api('/projects/'+current.id+'/scenes/'+id+'/regenerate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:$('prompt-'+id).value})});toast('正在重新生成');openProject(current.id)}catch(e){toast(e.message)}}function replacePick(id){$('file-'+id).click()}async function replaceScene(id,file){if(!file)return;let f=new FormData();f.append('image',file);try{await api('/projects/'+current.id+'/scenes/'+id+'/replace',{method:'POST',body:f});refresh(current.id)}catch(e){toast(e.message)}}async function removeScene(id){if(current.scenes.length<=1)return toast('至少保留一个镜头');try{await api('/projects/'+current.id+'/scenes/'+id,{method:'DELETE'});refresh(current.id)}catch(e){toast(e.message)}}async function move(id,d){let ids=current.scenes.map(x=>x.id),i=ids.indexOf(id),j=i+d;if(j<0||j>=ids.length)return;[ids[i],ids[j]]=[ids[j],ids[i]];try{await api('/projects/'+current.id+'/scenes/reorder',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({scene_ids:ids})});refresh(current.id)}catch(e){toast(e.message)}}
$('insertImage').onchange=async e=>{let f=new FormData(),file=e.target.files[0];if(!file)return;f.append('image',file);f.append('position','-1');try{await api('/projects/'+current.id+'/scenes',{method:'POST',body:f});e.target.value='';refresh(current.id)}catch(x){toast(x.message)}};$('insertVideo').onchange=e=>{let file=e.target.files[0];if(!file)return;clipFile=file;if(clipUrl)URL.revokeObjectURL(clipUrl);clipUrl=URL.createObjectURL(file);let v=$('clipPreview');v.src=clipUrl;v.onloadedmetadata=()=>{let d=v.duration;if(d<1){closeClipPicker();return toast('视频至少1秒')}if(d>600.05){closeClipPicker();return toast('源视频最长10分钟')}let end=Math.min(30,d);['clipStart','clipEnd'].forEach(id=>$(id).max=d);$('clipStart').value=0;$('clipEnd').value=end;$('clipStartNumber').value=0;$('clipEndNumber').value=end;$('sourceDuration').textContent='源视频约 '+Math.round(d)+' 秒，最多选择30秒';$('clipPicker').classList.remove('hide');updateClip('end')};v.load()};function updateClip(changed){let max=+$('clipStart').max,start=+$('clipStart').value,end=+$('clipEnd').value;if(changed==='start'){start=Math.min(start,end-1);if(end-start>30)end=start+30}else{end=Math.max(end,start+1);if(end-start>30)start=end-30}start=Math.max(0,start);end=Math.min(max,end);$('clipStart').value=start;$('clipEnd').value=end;$('clipStartNumber').value=start.toFixed(1);$('clipEndNumber').value=end.toFixed(1);$('clipLength').textContent='已选 '+(end-start).toFixed(1)+' 秒 · 原声关闭';$('clipPreview').currentTime=start}$('clipStart').oninput=()=>updateClip('start');$('clipEnd').oninput=()=>updateClip('end');$('clipStartNumber').onchange=()=>{$('clipStart').value=$('clipStartNumber').value;updateClip('start')};$('clipEndNumber').onchange=()=>{$('clipEnd').value=$('clipEndNumber').value;updateClip('end')};function closeClipPicker(){$('clipPicker').classList.add('hide');$('insertVideo').value='';clipFile=null;if(clipUrl)URL.revokeObjectURL(clipUrl)}async function confirmVideoClip(){let b=$('uploadClip'),f=new FormData();f.append('video',clipFile);f.append('start',$('clipStart').value);f.append('end',$('clipEnd').value);f.append('position','-1');b.disabled=true;try{await api('/projects/'+current.id+'/video-scenes',{method:'POST',body:f});closeClipPicker();refresh(current.id)}catch(e){toast(e.message)}finally{b.disabled=false}}async function produce(){try{await api('/projects/'+current.id+'/produce',{method:'POST'});openProject(current.id)}catch(e){toast(e.message)}}async function downloadVideo(){let r=await fetch(API+'/projects/'+current.id+'/download',{headers:{Authorization:'Bearer '+token}}),u=URL.createObjectURL(await r.blob()),a=document.createElement('a');a.href=u;a.download=(current.title||'共搭成片')+'.mp4';a.click();URL.revokeObjectURL(u)}async function boot(){init();if(token)try{sessionData=await api('/session');return openStudio()}catch(e){}clearLogin()}boot();
</script></body></html>
