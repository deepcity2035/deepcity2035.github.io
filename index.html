<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>一刻成片</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf2ef;color:#13211e;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:520px;min-height:100vh;margin:auto;background:#fff;padding:20px 18px 90px}.hide{display:none!important}.brand{display:flex;align-items:center;justify-content:space-between;font-weight:850}.brand-left{display:flex;align-items:center;gap:9px}.logo{display:grid;place-items:center;width:38px;height:38px;border-radius:13px;background:#116552;color:#fff}.link{border:0;background:none;color:#60716c;font-size:13px}h1{font-size:29px;line-height:1.2;margin:32px 0 9px}h2{font-size:22px;margin:26px 0 8px}.muted{color:#687873;font-size:13px;line-height:1.65}.field,.area{width:100%;border:1px solid #cbd9d5;border-radius:15px;background:#f8fbfa;padding:14px;font:inherit;font-size:16px;outline:none}.field{height:50px;margin-top:11px}.area{min-height:115px;resize:vertical;margin-top:10px}.area.script{min-height:280px;line-height:1.75}.btn{width:100%;border:0;border-radius:14px;background:#116552;color:#fff;padding:15px;font-size:16px;font-weight:800;margin-top:15px}.btn.secondary{background:#e8f3ef;color:#116552}.btn.light{background:#f1f4f3;color:#34433f}.btn.danger{background:#fff0ef;color:#aa2c25}.btn:disabled{opacity:.5}.login{padding-top:18vh}.remember{display:flex;align-items:center;gap:9px;margin:14px 2px;color:#53645f;font-size:14px}.choices{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:12px 0}.choices button{border:1px solid #dfe8e5;background:#fff;border-radius:11px;padding:11px 3px}.choices .on{background:#116552;color:#fff}.step{display:flex;gap:5px;margin:24px 0 4px}.step i{height:5px;flex:1;background:#e2e9e6;border-radius:5px}.step i.on{background:#1d8068}.notice{padding:13px 14px;margin-top:15px;border-radius:13px;background:#eef8f4;color:#38655a;font-size:14px}.history{margin-top:28px;border-top:1px solid #edf0ef}.project{display:flex;justify-content:space-between;align-items:center;padding:15px 2px;border-bottom:1px solid #edf0ef}.project b{display:block;max-width:310px}.tag{font-size:12px;color:#116552;background:#e9f5f1;padding:5px 8px;border-radius:20px}.scene{border:1px solid #e1e8e5;border-radius:18px;margin-top:16px;overflow:hidden}.scene img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#e8eeeb}.scene-body{padding:13px}.scene-title{display:flex;justify-content:space-between;font-weight:800}.scene .area{min-height:76px;font-size:14px}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.actions button{border:0;border-radius:10px;padding:10px 4px;background:#eef4f2;color:#31564d}.upload-label{display:block;text-align:center;border:1px dashed #74aa9d;border-radius:14px;padding:17px;color:#116552;margin-top:15px}.upload-label input{display:none}.status{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);width:min(484px,calc(100% - 36px));padding:13px 15px;background:#172b26eF;color:#fff;border-radius:14px;font-size:14px;box-shadow:0 8px 30px #0003}.error{color:#bd2424;font-size:13px}.video{width:100%;margin-top:17px;border-radius:15px;background:#000}
</style></head><body><main class="app">
<section id="login" class="login"><div class="logo">✦</div><h1>登录一刻成片</h1><p class="muted">登录一次，手机上可持续使用</p><input id="user" class="field" value="admin" placeholder="账号"><input id="pass" class="field" type="password" placeholder="密码"><label class="remember"><input id="remember" type="checkbox" checked> 30天内保持登录</label><p id="err" class="error"></p><button class="btn" onclick="login()">登录</button></section>
<section id="studio" class="hide"><div class="brand"><div class="brand-left"><span class="logo">✦</span>一刻成片</div><button class="link" onclick="logout()">退出</button></div>
<div id="home"><h1>一个标题，<br>逐步确认后成片。</h1><p class="muted">先确认文案，再确认每张图片，最后正式生产。</p><textarea id="topic" class="area" placeholder="例如：AI行业大脑，一城一智，一人成军"></textarea><h2>成片时长</h2><div class="choices" id="durations"><button>30秒</button><button class="on">60秒</button><button>90秒</button><button>3分钟</button></div><button class="btn" onclick="createProject()">生成文案</button><div class="history"><h2>历史项目</h2><div id="history"><p class="muted">正在读取…</p></div></div></div>
<div id="editor" class="hide"><button class="link" onclick="showHome()">← 返回项目</button><div class="step"><i id="s1"></i><i id="s2"></i><i id="s3"></i></div><div id="waiting"><h1 id="waitTitle">正在处理</h1><p id="waitText" class="muted">请稍候，关闭页面也不会中断。</p></div>
<div id="scriptReview" class="hide"><h1>确认文案</h1><p class="muted">你修改后的版本将直接用于配音和字幕。</p><input id="editTitle" class="field" placeholder="标题"><input id="editHook" class="field" placeholder="开场钩子"><textarea id="editScript" class="area script" placeholder="完整口播文案"></textarea><textarea id="editDesc" class="area" placeholder="内容简介"></textarea><button class="btn" onclick="confirmScript()">确认文案，生成配图</button></div>
<div id="imageReview" class="hide"><h1>确认配图</h1><p class="muted">可以修改描述重新生成、上传替换、删除或调整顺序。</p><div id="scenes"></div><label class="upload-label">＋ 插入自己的图片<input id="insertImage" type="file" accept="image/*"></label><button class="btn" onclick="produce()">图片确认，正式生产</button></div>
<div id="done" class="hide"><h1>成片已完成</h1><p class="muted">文案、图片、配音与字幕均以确认版本生产。</p><video id="preview" class="video" controls playsinline></video><button class="btn" onclick="downloadVideo()">下载成片</button></div></div></section>
<div id="toast" class="status hide"></div></main><script>
const API='https://api.opc.city';let token=localStorage.getItem('autocut_token')||sessionStorage.getItem('autocut_token')||'',seconds=60,current=null,timer=null;const $=id=>document.getElementById(id);const labels={queued:'等待生成',drafting:'文案生成中',script_review:'待确认文案',images_queued:'等待配图',images_generating:'配图生成中',images_review:'待确认图片',produce_queued:'等待生产',producing:'视频生产中',done:'已完成',failed:'处理失败'};
function toast(t){$('toast').textContent=t;$('toast').classList.remove('hide');setTimeout(()=>$('toast').classList.add('hide'),2500)}
async function api(path,opt={}){opt.headers={...(opt.headers||{}),Authorization:'Bearer '+token};let r=await fetch(API+path,opt),d=await r.json().catch(()=>({}));if(r.status===401){clearLogin();throw Error('登录已失效，请重新登录')}if(!r.ok)throw Error(d.detail||'操作失败');return d}
function clearLogin(){localStorage.removeItem('autocut_token');sessionStorage.removeItem('autocut_token');token='';$('studio').classList.add('hide');$('login').classList.remove('hide')}
async function login(){try{let remember=$('remember').checked,r=await fetch(API+'/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('user').value,password:$('pass').value,remember})}),d=await r.json();if(!r.ok)throw Error(d.detail);token=d.token;(remember?localStorage:sessionStorage).setItem('autocut_token',token);openStudio()}catch(e){$('err').textContent=e.message}}
async function logout(){try{await api('/logout',{method:'POST'})}catch(e){}clearLogin()}
async function boot(){if(token)try{await api('/session');return openStudio()}catch(e){}clearLogin()}
function openStudio(){$('login').classList.add('hide');$('studio').classList.remove('hide');showHome()}
function showHome(){if(timer)clearInterval(timer);current=null;$('editor').classList.add('hide');$('home').classList.remove('hide');loadHistory()}
[...$('durations').children].forEach((b,i)=>b.onclick=()=>{seconds=[30,60,90,180][i];[...b.parentNode.children].forEach(x=>x.classList.remove('on'));b.classList.add('on')});
async function loadHistory(){try{let rows=await api('/projects');$('history').innerHTML=rows.length?rows.map(p=>`<div class="project" onclick="openProject('${p.id}')"><b>${esc(p.title)}</b><span class="tag">${labels[p.status]||p.status}</span></div>`).join(''):'<p class="muted">还没有项目</p>'}catch(e){toast(e.message)}}
async function createProject(){let title=$('topic').value.trim();if(!title)return toast('请先填写标题');try{let p=await api('/projects',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title,seconds})});openProject(p.id)}catch(e){toast(e.message)}}
async function openProject(id){$('home').classList.add('hide');$('editor').classList.remove('hide');await refresh(id);if(timer)clearInterval(timer);timer=setInterval(()=>refresh(id),3000)}
function step(n){['s1','s2','s3'].forEach((x,i)=>$(x).classList.toggle('on',i<n))}
async function refresh(id){try{let p=await api('/projects/'+id);current=p;render(p);if(['script_review','images_review','done','failed'].includes(p.status)&&timer){clearInterval(timer);timer=null}}catch(e){toast(e.message)}}
function panels(name){['waiting','scriptReview','imageReview','done'].forEach(x=>$(x).classList.toggle('hide',x!==name))}
function render(p){if(['queued','drafting'].includes(p.status)){step(1);panels('waiting');$('waitTitle').textContent='AI正在生成文案';$('waitText').textContent='关闭页面也不会中断，稍后可在历史项目继续。'}else if(p.status==='script_review'){step(1);panels('scriptReview');$('editTitle').value=p.content.title||p.title;$('editHook').value=p.content.hook||'';$('editScript').value=p.content.script||'';$('editDesc').value=p.content.description||''}else if(['images_queued','images_generating'].includes(p.status)){step(2);panels('waiting');$('waitTitle').textContent='正在生成配图';$('waitText').textContent=`已生成 ${p.scenes?.length||0} 张，请稍候…`}else if(p.status==='images_review'){step(2);panels('imageReview');renderScenes(p)}else if(['produce_queued','producing'].includes(p.status)){step(3);panels('waiting');$('waitTitle').textContent='正在正式生产';$('waitText').textContent='正在生成配音、字幕、动画和高清视频。'}else if(p.status==='done'){step(3);panels('done');$('preview').src=API+'/projects/'+p.id+'/download?token='+encodeURIComponent(token)}else if(p.status==='failed'){panels('waiting');$('waitTitle').textContent='处理未完成';$('waitText').textContent=p.error||'请返回后重试'}}
async function confirmScript(){try{await api('/projects/'+current.id+'/script',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:$('editTitle').value,hook:$('editHook').value,script:$('editScript').value,description:$('editDesc').value})});openProject(current.id)}catch(e){toast(e.message)}}
function renderScenes(p){$('scenes').innerHTML=p.scenes.map((s,i)=>`<div class="scene"><img src="${API}/projects/${p.id}/images/${s.image}?token=${encodeURIComponent(token)}&v=${s.version||0}"><div class="scene-body"><div class="scene-title"><span>镜头 ${i+1}</span><span>${s.generating?'生成中…':''}</span></div><textarea id="prompt-${s.id}" class="area">${esc(s.prompt)}</textarea><div class="actions"><button onclick="regen('${s.id}')">重新生成</button><button onclick="replacePick('${s.id}')">上传替换</button><button onclick="removeScene('${s.id}')">删除</button><button onclick="move('${s.id}',-1)">上移</button><button onclick="move('${s.id}',1)">下移</button></div><input class="hide" id="file-${s.id}" type="file" accept="image/*" onchange="replaceScene('${s.id}',this.files[0])"></div></div>`).join('')}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function regen(id){try{await api(`/projects/${current.id}/scenes/${id}/regenerate`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:$('prompt-'+id).value})});toast('正在重新生成');openProject(current.id)}catch(e){toast(e.message)}}
function replacePick(id){$('file-'+id).click()}async function replaceScene(id,file){if(!file)return;let f=new FormData();f.append('image',file);try{await api(`/projects/${current.id}/scenes/${id}/replace`,{method:'POST',body:f});refresh(current.id)}catch(e){toast(e.message)}}
async function removeScene(id){if(current.scenes.length<=1)return toast('至少保留一张图片');try{await api(`/projects/${current.id}/scenes/${id}`,{method:'DELETE'});refresh(current.id)}catch(e){toast(e.message)}}
async function move(id,delta){let ids=current.scenes.map(x=>x.id),i=ids.indexOf(id),j=i+delta;if(j<0||j>=ids.length)return;[ids[i],ids[j]]=[ids[j],ids[i]];try{await api(`/projects/${current.id}/scenes/reorder`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({scene_ids:ids})});refresh(current.id)}catch(e){toast(e.message)}}
$('insertImage').onchange=async e=>{let file=e.target.files[0];if(!file)return;let f=new FormData();f.append('image',file);f.append('position','-1');try{await api(`/projects/${current.id}/scenes`,{method:'POST',body:f});e.target.value='';refresh(current.id)}catch(x){toast(x.message)}};
async function produce(){try{await api(`/projects/${current.id}/produce`,{method:'POST'});openProject(current.id)}catch(e){toast(e.message)}}
async function downloadVideo(){let r=await fetch(API+`/projects/${current.id}/download`,{headers:{Authorization:'Bearer '+token}}),u=URL.createObjectURL(await r.blob()),a=document.createElement('a');a.href=u;a.download=(current.title||'一刻成片')+'.mp4';a.click();URL.revokeObjectURL(u)}boot();
</script></body></html>
