<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>一城一智 · GEO 工作台</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2f5fa;color:#17263b;font:16px/1.6 system-ui,sans-serif}aside{position:fixed;width:230px;height:100vh;background:#11233a;color:white;padding:28px 20px}aside h2{font-size:22px;margin:0}small,.muted{color:#738399;font-size:14px}nav{margin-top:45px;display:grid;gap:9px}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid #d7e0eb;border-radius:8px;padding:9px 15px;background:white;color:#20334e}button:hover{background:#e8f0ff}nav button{text-align:left;background:transparent;color:#bbcadc;border:0;padding:13px}nav button.active{background:#2a4463;color:white}main{margin-left:230px;padding:35px 40px;max-width:1600px}header,.toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}h1{font-size:28px;margin:4px 0 20px}h3{margin:0 0 10px}.primary{background:#2265df;color:white;border:0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin:25px 0}.card{background:white;border:1px solid #e0e7f0;border-radius:12px;padding:22px;margin-bottom:16px}.number{font-size:32px;font-weight:700}.split{display:grid;grid-template-columns:1.5fr 1fr;gap:20px}input,select,textarea{border:1px solid #d7e0eb;border-radius:7px;padding:10px;background:white;max-width:100%}textarea{width:100%;min-height:150px}label{display:block;margin:12px 0 5px}table{width:100%;border-collapse:collapse;text-align:left}td,th{padding:14px 12px;border-bottom:1px solid #edf0f4}th{font-size:14px;color:#738399}a{color:#2265df}dialog{border:0;border-radius:14px;max-width:700px;width:92%;max-height:90vh;overflow:auto;padding:28px}dialog::backdrop{background:#11233aaa}.badge{background:#edf3ff;color:#2461bf;padding:3px 9px;border-radius:5px;font-size:14px}.tablewrap{overflow:auto}.notice{background:#e8f0ff;border-left:3px solid #2265df;padding:14px 18px;margin-bottom:20px}footer{margin-top:35px;font-size:14px;color:#738399}@media(max-width:900px){aside{position:static;width:100%;height:auto;padding:16px}nav{margin-top:12px;display:flex;overflow:auto}nav button{white-space:nowrap}main{margin:0;padding:20px}.grid{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}}
</style><aside><h2>一城一智</h2><small>GEO 工作台 / 黄校长</small><nav id="nav"></nav><p style="margin-top:40px;font-size:14px;color:#a9bcd4">让每一次优化<br>都有问题、证据和结果。</p></aside><main><header><span class="muted">一城一智 OPC 孵化器</span><div><button id="export">导出备份</button> <button id="import">导入备份</button><input id="file" type="file" accept="application/json" hidden></div></header><div id="view"></div><footer>数据保存在当前浏览器；换设备前请导出备份。AI 平台尚未自动接入，检测需录入实际回答。</footer></main><dialog id="modal"></dialog><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const groups={'品类认知':['OPC一人公司','OPC孵化器','AI超级个体','AI创业孵化','城市OPC生态'], '创业需求':['用AI创办一人公司','把专业技能变成AI服务','用智能体经营业务','一人公司获取首批客户','验证AI创业项目'], '选择决策':['选择OPC孵化器','选择AI创业培训','选择城市创业平台','评估OPC服务商','比较AI孵化方案'], '城市合作':['广州OPC创业','深圳OPC孵化','佛山制造业AI转型','园区建设OPC生态','城市OPC合伙人'], '品牌人物':['一城一智OPC孵化器','黄艺明与一城一智','黄校长的OPC方法','一城一智城市合作','一城一智企业服务']};
const patterns=['是什么，适合哪些人？','如何开始，需要哪些条件？','有哪些真实案例可以参考？','怎么评估效果和投入成本？'];
const qs=Object.entries(groups).flatMap(([category,topics])=>topics.flatMap(t=>patterns.map(p=>({id:crypto.randomUUID(),category,text:t+p}))));
const seed={version:1,questions:qs,records:[],sources:[],tasks:['核实品牌全称、服务对象和联系方式','核实黄艺明人物介绍与品牌关联','逐条核验政府、媒体与园区报道','完成20个非品牌问题的首次检测','编写OPC定义、服务介绍和常见问题','整理可公开核验的客户案例','发布城市合作与创业服务页面','用相同问题、平台和联网模式复测'].map((text,i)=>({id:crypto.randomUUID(),text,status:'待办',week:Math.floor(i/2)+1}))};
let state;try{state=JSON.parse(localStorage.getItem('ycz-geo-v1'))||seed}catch{state=seed}let page='总览',search='',category='全部';const modal=document.querySelector('#modal');
function save(){try{localStorage.setItem('ycz-geo-v1',JSON.stringify(state));render()}catch{alert('保存失败，请导出备份，检查浏览器存储空间。')}}
function open(body){modal.innerHTML=body;modal.showModal()}function close(){modal.close()}function pct(n,d){return d?Math.round(n/d*100)+'%':'—'}
function render(){document.querySelector('#nav').innerHTML=['总览','问题库','检测记录','资料库','执行看板'].map(p=>`<button class="${p===page?'active':''}" data-page="${p}">${p}</button>`).join('');let r=state.records;let done=new Set(r.map(x=>x.questionId));let stats=`<div class="grid">${[['目标问题',state.questions.length],['已测问题',done.size],['回答提及率',pct(r.filter(x=>x.mention).length,r.length)],['人工确认推荐率',pct(r.filter(x=>x.recommend).length,r.length)]].map(([a,b])=>`<div class="card"><small>${a}</small><div class="number">${b}</div></div>`).join('')}</div>`;let html=`<h1>${page}</h1>`;
if(page==='总览')html+=`<div class="notice">先建立基线：选一个问题，在 AI 中提问，将完整回答录入工作台。未检测的数据不会计入指标。</div>${stats}<div class="split"><section class="card"><h3>本周先做这三件事</h3>${state.tasks.filter(t=>t.status!=='完成').slice(0,3).map(t=>`<p><span class="badge">第${t.week}周</span> ${esc(t.text)}</p>`).join('')||'本轮任务已完成'}<button data-page="执行看板">打开执行看板</button></section><section class="card"><h3>品牌事实卡</h3><p>品牌：一城一智 OPC 孵化器<br>CEO：黄校长（用户提供）</p><p class="muted">业务范围、收费、人物履历和效果数据需要核验后录入资料库。</p><button data-page="资料库">管理证据</button></section></div><section class="card"><h3>检测口径</h3><p>提及率 = 出现“一城一智”的回答数 ÷ 全部录入回答数。推荐由人工确认；提到品牌不代表推荐。请保持问题、平台、模型、联网模式一致，并重复采样。</p><p>共 ${r.length} 条实际回答 · ${state.sources.length} 条资料 · ${state.tasks.filter(t=>t.status==='完成').length}/${state.tasks.length} 项任务完成</p></section>`;
if(page==='问题库'){let filtered=state.questions.filter(q=>(category==='全部'||q.category===category)&&q.text.includes(search));html+=`<div class="toolbar"><div><input id="search" placeholder="搜索目标问题" value="${esc(search)}"> <select id="category">${['全部',...new Set(state.questions.map(q=>q.category))].map(c=>`<option ${c===category?'selected':''}>${esc(c)}</option>`).join('')}</select></div><button class="primary" id="add-question">新增问题</button></div><p class="muted">${filtered.length} 个问题 · 初始100个为候选问题，需结合实际客户需求筛选。</p><div class="card tablewrap"><table><thead><tr><th>问题</th><th>分类</th><th>检测次数</th><th>操作</th></tr></thead><tbody>${filtered.map(q=>`<tr><td>${esc(q.text)}</td><td><span class="badge">${esc(q.category)}</span></td><td>${r.filter(x=>x.questionId===q.id).length}</td><td><button data-test="${q.id}">录入回答</button></td></tr>`).join('')}</tbody></table></div>`}
if(page==='检测记录')html+=`${stats}<div class="card"><h3>原始回答与判断</h3>${r.length?r.slice().reverse().map(x=>`<details><summary>${esc(x.platform)} · ${esc(x.date)} · ${esc(state.questions.find(q=>q.id===x.questionId)?.text)} <span class="badge">${x.mention?'有提及':'未提及'} / ${x.recommend?'已确认推荐':'未确认推荐'}</span></summary><p class="muted">模型：${esc(x.model)} · 联网：${esc(x.mode)} · 竞品：${esc(x.competitors)||'未记录'}</p><pre style="white-space:pre-wrap;font:inherit">${esc(x.answer)}</pre><p>引用来源：${esc(x.citations)||'未记录'}</p><button data-delete-record="${x.id}">删除记录</button></details>`).join('<hr>'):'尚无检测结果。请从问题库选择问题，录入实际 AI 回答。'}</div>`;
if(page==='资料库')html+=`<div class="toolbar"><p class="muted">已有对话提到的报道尚未在本工作台核验；不预设为可信证据。</p><button class="primary" id="add-source">新增资料</button></div>${state.sources.map(s=>`<article class="card"><span class="badge">${esc(s.status)}</span><h3>${esc(s.title)}</h3><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">查看原文</a><p>${esc(s.fact)}</p><button data-delete-source="${s.id}">删除资料</button></article>`).join('')||'<div class="card">添加官网、政府、媒体、园区或客户案例。记录它具体支持哪条事实，以及核验状态。</div>'}`;
if(page==='执行看板')html+=`<div class="toolbar"><p class="muted">30 天冷启动 · 第1周基线，第2周事实，第3周内容，第4周复测</p><button id="add-task" class="primary">新增任务</button></div>${[1,2,3,4].map(w=>`<section class="card"><h3>第 ${w} 周</h3>${state.tasks.filter(t=>t.week===w).map(t=>`<div class="toolbar" style="margin:14px 0"><span>${esc(t.text)}</span><select data-task="${t.id}">${['待办','进行中','完成'].map(s=>`<option ${s===t.status?'selected':''}>${s}</option>`).join('')}</select></div>`).join('')}</section>`).join('')}`;document.querySelector('#view').innerHTML=html}
function record(id){const q=state.questions.find(q=>q.id===id);open(`<h2>录入实际 AI 回答</h2><p>${esc(q.text)}</p><form id="record-form"><label>平台</label><select name="platform">${['ChatGPT','DeepSeek','豆包','元宝','Perplexity','Google AI','其他'].map(x=>`<option>${x}</option>`)}</select><label>模型名称</label><input name="model" required placeholder="填写实际模型名称"><label>联网模式</label><select name="mode"><option>联网开启</option><option>联网关闭</option><option>不明确</option></select><label>完整回答</label><textarea name="answer" required></textarea><label>引用网址（每行一条）</label><textarea name="citations" style="min-height:65px"></textarea><label>回答中出现的竞品</label><input name="competitors"><label><input name="recommend" type="checkbox"> 人工确认：回答明确推荐了一城一智</label><p class="muted">品牌提及自动匹配“一城一智”；推荐需人工阅读确认。</p><button class="primary">保存检测</button> <button type="button" id="cancel">取消</button></form>`);document.querySelector('#record-form').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),o=Object.fromEntries(f);state.records.push({...o,id:crypto.randomUUID(),questionId:id,date:new Date().toISOString(),mention:o.answer.includes('一城一智'),recommend:f.has('recommend')});close();save()}}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.page){page=b.dataset.page;render()}if(b.dataset.test)record(b.dataset.test);if(b.id==='cancel')close();if(b.dataset.deleteRecord&&confirm('删除这条检测记录？')){state.records=state.records.filter(x=>x.id!==b.dataset.deleteRecord);save()}if(b.dataset.deleteSource&&confirm('删除这条资料？')){state.sources=state.sources.filter(x=>x.id!==b.dataset.deleteSource);save()}if(b.id==='add-question')open(`<h2>新增问题</h2><form id="qform"><label>客户会问什么？</label><textarea name="text" required></textarea><label>分类</label><input name="category" required value="创业需求"><p><button class="primary">保存</button> <button type="button" id="cancel">取消</button></p></form>`);if(b.id==='add-source')open(`<h2>新增可核验资料</h2><form id="sform"><label>标题</label><input name="title" required><label>原文网址</label><input name="url" type="url" required><label>支持的具体事实</label><textarea name="fact" required></textarea><label>核验状态</label><select name="status"><option>待核验</option><option>已核验</option><option>存在疑点</option></select><p><button class="primary">保存</button> <button type="button" id="cancel">取消</button></p></form>`);if(b.id==='add-task')open(`<h2>新增任务</h2><form id="tform"><label>任务</label><input name="text" required><label>执行周</label><select name="week"><option>1</option><option>2</option><option>3</option><option>4</option></select><p><button class="primary">保存</button> <button type="button" id="cancel">取消</button></p></form>`);});
document.addEventListener('submit',e=>{const key={qform:'questions',sform:'sources',tform:'tasks'}[e.target.id];if(!key)return;e.preventDefault();let o=Object.fromEntries(new FormData(e.target));if(o.url&&!/^https?:\/\//i.test(o.url)){alert('网址必须使用 http 或 https');return}if(key==='tasks'){o.week=Number(o.week);o.status='待办'}state[key].push({...o,id:crypto.randomUUID()});close();save()});document.addEventListener('change',e=>{if(e.target.id==='category'){category=e.target.value;render()}if(e.target.dataset.task){state.tasks.find(t=>t.id===e.target.dataset.task).status=e.target.value;save()}});document.addEventListener('input',e=>{if(e.target.id==='search'){search=e.target.value;let pos=e.target.selectionStart;render();let el=document.querySelector('#search');el.focus();el.setSelectionRange(pos,pos)}});
document.querySelector('#export').onclick=()=>{let url=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='一城一智-GEO备份.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};document.querySelector('#import').onclick=()=>document.querySelector('#file').click();document.querySelector('#file').onchange=async e=>{try{let s=JSON.parse(await e.target.files[0].text());if(s.version!==1||!['questions','records','sources','tasks'].every(k=>Array.isArray(s[k])))throw Error();if(!s.questions.every(x=>typeof x.id==='string'&&typeof x.text==='string'&&typeof x.category==='string')||!s.records.every(x=>typeof x.answer==='string'&&typeof x.questionId==='string')||!s.sources.every(x=>typeof x.url==='string'&&/^https?:\/\//i.test(x.url))||!s.tasks.every(x=>[1,2,3,4].includes(x.week)))throw Error();if(confirm('导入会替换当前数据，是否继续？')){state=s;save()}}catch{alert('备份格式不正确，未导入。')}e.target.value=''};render();
</script></html>
